# Single shared ccache configuration for the whole z80 workspace.
# Selected via CCACHE_CONFIGPATH (scripts/ccache-wrapper, Makefile,
# rebuild-*.sh). Deliberately NOT named ccache.conf: ccache would pick a
# workspace-root ccache.conf up as a "directory config" and reject max_size.
#
# TODO (2026-11-14): max_size = 30G is a provisional value. Investigate
# real cache usage across LLVM/MAME/z88dk/Open Watcom builds (ccache -s)
# and adjust. Earlier notes said 50G; the user's ~/Library/Preferences
# config said 20G; the sandbox could not read it and fell back to 5G.
max_size = 30G
compression = true
